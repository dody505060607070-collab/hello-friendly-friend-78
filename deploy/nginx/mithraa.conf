# Nginx — مثراء على Hostinger VPS
# ضعه في /etc/nginx/sites-available/mithraa ثم:
#   ln -s /etc/nginx/sites-available/mithraa /etc/nginx/sites-enabled/
#   certbot --nginx -d your-domain.sa -d www.your-domain.sa

server {
    listen 80;
    server_name your-domain.sa www.your-domain.sa;

    client_max_body_size 200M;

    # بوابة الخلفية (قاعدة البيانات/الحسابات/Realtime) عبر Kong
    location /api-gw/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # التطبيق نفسه
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
